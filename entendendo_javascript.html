<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprendendo JS</title>
</head>
<body>
    <h1>Boas vindos</h1>

    <label>Digite seu nome:</label>
    <input type="text" id="nome">
    <button onclick="mostrarMensagem()">Enviar</button>
    <p id="resultado"></p>
    <script>
        function mostrarMensagem(){
            let nome = document.getElementById("nome").value;

            document.getElementById("resultado").textContent = 
            "Olá " + nome + "! Seja bem-vindo(a)";
        }
    </script> 

    <h1> Calculadora de Somar </h1>
    <label>Primeiro número</label>
    <input type="number" id="numero1">
    <label>Segundo número</label>
    <input type="number" id="numero2">
    <button onclick="somar()">Enviar</button>
    <p id="resultado"></p>
    <script>
        function somar(){
            let n1 = Number(document.getElementById("numero1").value);
            let n2 = Number(document.getElementById("numero2").value);
            let soma = n1 + n2;
            document.getElementById("resultado").textContent = "Resultado: " + soma;
        }
    </script>

    <h1> Verificar Idade </h1>
    <input type="number" id="idade" placeholder="Digite sua idade">
    <button onclick="verificarIdade()">Enviar</button>
    <p id="resultado"></p>
    <script>
        function verificarIdade(){
            let idade = Number(document.getElementById("idade").value);

            if(idade >= 18){
                document.getElementById("resultado").textContent = "Você tem " + idade + "! Você é maior de idade";
            }else{
                document.getElementById("resultado").textContent = "Você tem " + idade + "! Você é menor de idade";
            }
        }
    </script>

    <h1> Calcular média </h1>
    <input type="number" id="nota1" placeholder="Digite primeira nota">
    <input type="number" id="nota2" placeholder="Digite segunda nota">
    <input type="number" id="nota3" placeholder="Digite terceira nota">
    <button onclick="calcularMedia()">Enviat</button>
    <p id="resultado"></p>
    <script>
        function calcularMedia(){
            let n1 = Number(document.getElementById("nota1").value);
            let n2 = Number(document.getElementById("nota2").value);
            let n3 = Number(document.getElementById("nota3").value);

            let notas = [n1,n2,n3];
            let soma = 0;

            for(let nota of notas){
                soma=soma+nota;
            }

            let media = soma / notas.length;

            let mensagem = "Média: " + media.toFixed(2);

            if(media >= 6){
                mensagem += " - Aluno aprovado";
            }else{
                mensagem += " - Aluno reprovado";
            }

            document.getElementById("resultado").textContent = mensagem;


        }
    </script>

        <h1> Calculadora </h1>
    <input type="number" id="n1" placeholder="Primeiro número">
    <select id="operador">
        <option value="+">Somar</option>
        <option value="-">Subtração</option>
        <option value="*">Multiplicação</option>
        <option value="/">Divisão</option>
    </select>
    <input type="number" id="n2" placeholder="Segundo número">
    <button onclick="calcular()">Enviar</button>
    <p id="resultado"></p>
    <script>
        function calcular(){
            let n1 = document.getElementById("n1").value;
            let n2 = document.getElementById("n2").value;
            let operador = document.getElementById("operador").value;
            let resultado;

            switch(operador){
                case "+":
                    resultado = n1 + n2;
                    break;
                case "-":
                    resultado = n1 - n2;
                    break;
                    case "*":
                    resultado = n1 * n2;
                    break;
                    case "/":
                        if(n2===0){
                            resultado = "Não é possível dividir por zero";
                    }else{
                        resultado = n1/n2;
                    }
                        break;
                    
                    
                
              }
              document.getElementById("resultado").textContent = "Resultado: " + resultado;
        }
            
</body>
</html>
