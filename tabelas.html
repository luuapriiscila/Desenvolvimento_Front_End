<!DOCTYPE html>
<html lang="en">
<head>

    <title>Tabelas</title>
</head>
<body>
    <table  border="1" width="100%"> 
        <tr>
            <td colspan="3" bgcolor="green" height="50">A</td>
        </tr>
        <tr>
            <td>A</td>
            <td>B</td>
            <td>C</td>
        </tr>
        <tr>
            <td bgcolor="red">D</td>
            <td rowspan="2" bgcolor="yellow">E</td>
            <td>F</td>
        </tr>
        <tr>
            <td>G</td>
            <td>H</td>
            <td>I</td>
        </tr>/
    </table>
    
</body>
</html>
